name: Check birthday clock
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '**.js'
      - '**.mjs'
      - '*.json'
      - 'index.html'
      - '.github/workflows/check.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs
      - run: node --check script.js
